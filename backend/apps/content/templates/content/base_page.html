{% load wagtailcore_tags %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} | تک‌بیس</title>
  <meta name="description" content="{{ page.summary|default:page.title|striptags|truncatewords:30 }}" />
  <link rel="canonical" href="{% pageurl page %}" />
</head>
<body>
  <main>
    {% include "content/partials/breadcrumbs.html" %}
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="summary">{{ page.summary }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
