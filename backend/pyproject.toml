[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "config"]
exclude = [".venv", "migrations", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ", "RUF"]
ignore = [
    "E501",  # line length handled by formatter
    # Persian UI strings legitimately contain «×», «» and ZWNJ — the ambiguous-unicode
    # rules are for code identifiers, not for user-facing copy.
    "RUF001",
    "RUF002",
    "RUF003",
    # Django/DRF class attributes (Meta, permission_classes, ...) are class-level
    # config, not mutable state.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DJ01"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
exclude = ["migrations", "\\.venv"]
plugins = ["mypy_django_plugin.main"]
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Wagtail's own deps
# (taggit, modelsearch) are pulled in by the app registry, not by our code.
module = ["taggit.*", "modelsearch.*", "modelcluster.*", "ahocorasick"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# wagtail-stubs covers the public API; the internals it re-exports from
# Django/Wagtail internals are not fully typed.
module = ["wagtail.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["apps", "tests"]
addopts = "-q --strict-markers"
markers = [
    "pgvector: requires PostgreSQL + pgvector (deselect with '-m \"not pgvector\"')",
]
filterwarnings = ["ignore::DeprecationWarning"]
