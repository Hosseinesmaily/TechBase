[pytest]
; Root config so pytest works from the repo root (make test LOCAL=1, IDE discovery).
; Mirrors backend/pyproject.toml [tool.pytest.ini_options]; when running from
; backend/ that file wins instead. Keep both in sync.
DJANGO_SETTINGS_MODULE = config.settings.test
pythonpath = backend
python_files = test_*.py *_tests.py
testpaths = backend/apps backend/tests
addopts = -q --strict-markers
markers =
    pgvector: requires PostgreSQL + pgvector (deselect with '-m "not pgvector"')
filterwarnings =
    ignore::DeprecationWarning
